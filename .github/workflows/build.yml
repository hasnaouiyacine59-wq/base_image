name: Build and Push

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker/ubuntu-vnc-xfce
          file: ./docker/ubuntu-vnc-xfce/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ubuntu-vnc-xfce:focal
          build-args: |
            BASETAG=20.04
            PYTHON_NUMPY_PKG=python3-numpy
            ARG_REFRESHED_AT=${{ github.event.head_commit.timestamp }}
            ARG_VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
